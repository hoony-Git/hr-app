<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 기록 인사이트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    color-scheme: dark;
    --bg: #111214; --surface: #1b1c1f; --surface2: #25272b; --border: #2e3035;
    --text: #ececee; --muted: #8b8e95; --accent: #22c55e; --warn: #f59e0b; --bad: #ef4444; --info: #7dd3fc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; }
  h1 { font-size: 18px; margin: 4px 0 10px; }
  .src { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
  .tabs button { flex: none; padding: 9px 12px; border: 0; border-radius: 12px 12px 0 0; background: transparent; color: var(--muted); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .tabs button.sel { background: var(--surface); color: var(--text); }
  .card { background: var(--surface); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .card h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sub { font-size: 12px; color: var(--muted); }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .row:last-child { border-bottom: 0; }
  .row b { font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface2); color: var(--muted); margin-left: 4px; }
  .tag.ok { color: var(--accent); } .tag.over, .tag.under { color: var(--warn); } .tag.low { color: var(--muted); }
  .fields { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
  .fields div { background: var(--surface); border-radius: 10px; padding: 8px 2px; text-align: center; font-size: 11px; color: var(--muted); }
  .fields b { display: block; font-size: 13px; color: var(--text); }
  .mapwrap { position: relative; border-radius: 16px; overflow: hidden; background: #0b0f17; }
  canvas { display: block; width: 100%; height: 420px; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 70%; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding: 14px 16px; box-shadow: 0 -6px 20px rgba(0,0,0,.45); }
  .sheet h3 { font-size: 15px; margin-right: 32px; }
  .sheet .x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 0; border-radius: 8px; background: var(--surface2); color: var(--text); }
  .note { font-size: 13px; margin: 6px 0; } .note small { color: var(--muted); margin-right: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin: 8px 2px; }
  input[type=text], textarea { width: 100%; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: inherit; }
  .res { padding: 9px 4px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; } .res small { color: var(--muted); }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent); color: #04210f; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  .btn.ghost { background: var(--surface2); color: var(--text); font-weight: 500; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .presets .btn { font-size: 13px; padding: 8px 10px; }
  .chat { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .msg { padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; font-size: 14px; }
  .msg.me { align-self: flex-end; background: #14532d; max-width: 85%; }
  .msg.ai { background: var(--surface); }
  .msg.err { background: #3b1414; color: #fecaca; }
  .ask { display: flex; gap: 6px; } .ask textarea { min-height: 44px; resize: vertical; }
  .warn { background: #2a2414; color: #fde68a; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px; }
  .hidden { display: none !important; }
</style>
<div class="wrap">
  <h1>내 기록 인사이트</h1>
  <div class="src" id="src">기록을 불러오는 중…</div>
  <div id="loadBox" class="card hidden">
    <h2>기록 파일 직접 열기</h2>
    <div class="sub" id="loadWhy" style="margin-bottom:8px"></div>
    <input type="file" id="file" accept=".json,application/json">
    <div class="sub" style="margin-top:6px">hr-app 내정보 → 백업 내보내기 파일, 또는 Drive 의 hr-app-sync.json. 파일은 이 화면 안에서만 읽어요.</div>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="map" class="sel">독서 지도</button>
    <button data-t="ex">운동</button>

  </div>
  <section id="t-map">

    <div class="legend"><span>● 밝을수록 별점 높음</span><span>○ 읽는 중</span><span style="color:#fde047">✦ 최근 30일 완독</span><span style="color:#7dd3fc">◆ 감상·메모</span><span style="color:#fb923c">● 다시 분류할 후보</span></div>
    <input type="text" id="q" placeholder="제목·감상·메모 검색">

  </section>
  <section id="t-ex" class="hidden"></section>
  <section id="t-time" class="hidden"></section>
  <section id="t-ai" class="hidden">
    <div class="sub" style="margin-bottom:8px">AI 는 아래 화면에 나온 계산 결과와 책 제목·감상·메모만 봅니다. 운동 조언은 컨디션 관리용이며, 증상이 있으면 의사와 상담하세요.</div>
    <div class="presets" id="presets">
      <button class="btn ghost" data-p="이번 주 운동 어때?">이번 주 운동 어때?</button>
      <button class="btn ghost" data-p="오늘 시간 어떻게 썼어?">오늘 시간 어떻게 썼어?</button>
      <button class="btn ghost" data-p="내가 읽은 책 중 ○○ 관련은?" data-fill="1">내가 읽은 책 중 ○○ 관련은?</button>
      <button class="btn ghost" data-p="다음에 읽을 책 추천">다음에 읽을 책 추천</button>
    </div>
    <div class="chat" id="chat"></div>
    <div class="ask"><textarea id="askIn" placeholder="질문을 입력하세요"></textarea><button class="btn" id="askBtn">묻기</button></div>
    <button class="btn ghost hidden" id="stopBtn" style="margin-top:6px">멈추기</button>
  </section>
</div>

<script>
// 공유 지표 계산 (hr-app 과 artifact/insights.html 이 같은 파일을 쓴다).
// 순수 함수만: 화면(DOM)·저장소(localStorage)에 손대지 않는다. 입력은 { 저장키: 이미 JSON.parse 한 값 } 객체.
// 숫자는 전부 여기서 계산한다. AI 는 이 결과만 받아서 해석한다.
// 표본 규칙: 평균·비교 지표는 { n, coverage, insufficient } 를 붙인다. insufficient = coverage < 0.7 또는 n < 3.
//            단순 개수·합계(책 권수, 이번 주 Zone 2 합계 등)는 사실 그 자체라 insufficient 를 항상 false 로 둔다 (n 은 붙임).
(function (root) {
  'use strict';
  const DAY = 86400000, MIN = 60000, KST = 9 * 3600000;
  const BOOK_CATS = ['문학', '역사', '철학', '과학', '기타'];
  const DEFAULT_TARGETS = { '문학': 300, '역사': 200, '철학': 100, '과학': 100, '기타': 100 };
  const GOAL_DEFAULTS = { youtube_max_min_per_day: 60, sleep_min_hours: 7 };
  const LOG_KEY = /^time_log_\d{4}_\d{2}$/;

  // ---------- 입력 정리 (밖에서 온 값은 모양을 믿지 않는다) ----------
  const arr = v => (Array.isArray(v) ? v : []);
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
  const num = v => (typeof v === 'number' && isFinite(v) ? v : (typeof v === 'string' && v.trim() !== '' && isFinite(Number(v)) ? Number(v) : null));
  const str = v => (typeof v === 'string' ? v : '');
  const isDay = s => /^\d{4}-\d{2}-\d{2}$/.test(str(s));
  const r1 = v => (v == null ? null : Math.round(v * 10) / 10);
  const mean = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const pct = (v, g) => (v != null && g > 0 ? Math.round(v / g * 1000) / 10 : null);
  function sample(n, coverage) { return { n, coverage: coverage == null ? null : Math.round(coverage * 1000) / 1000, insufficient: (coverage != null && coverage < 0.7) || n < 3 }; }

  // hr-app-sync.json 의 data 는 { 키: 문자열 } — 이걸 { 키: 값 } 으로. 못 읽는 키는 건너뛰고 이름을 돌려준다
  function parseStore(strMap) {
    const out = {}, bad = [];
    Object.keys(obj(strMap)).forEach(k => {
      const v = strMap[k];
      if (typeof v !== 'string') { out[k] = v; return; }
      try { out[k] = JSON.parse(v); } catch (e) { bad.push(k); }
    });
    return { store: out, bad };
  }

  // ---------- 날짜 ----------
  const kst = ms => new Date(ms + KST);   // getUTC* 로 한국 시간 읽기 (시간 탭과 같은 기준)
  const pad = n => String(n).padStart(2, '0');
  const kstDayStart = ms => Math.floor((ms + KST) / DAY) * DAY - KST;
  const kstDayKey = ms => { const d = kst(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
  const kstDow = ms => (kst(ms).getUTCDay() + 6) % 7;   // 0=월
  const kstFromDay = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(s)); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) - KST : NaN; };
  const localDayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  // ================= 독서 =================
  function bookNotes(logs, id) {   // [{day, page, note}] 메모가 있는 날만, 날짜순
    const L = obj(obj(logs)[id]);
    return Object.keys(L).filter(isDay).sort().map(k => ({ day: k, page: num(L[k] && L[k].page), note: str(L[k] && L[k].note).trim() })).filter(x => x.note);
  }
  function cleanBooks(store) {
    return arr(store.book_list).filter(b => b && typeof b === 'object' && typeof b.id === 'string').map(b => ({
      id: b.id, title: str(b.title) || '(제목 없음)', author: str(b.author), category: BOOK_CATS.includes(b.category) ? b.category : '기타',
      status: str(b.status), rating: num(b.rating) >= 1 && num(b.rating) <= 5 ? num(b.rating) : null, review: str(b.review).trim(),
      startedAt: isDay(b.startedAt) ? b.startedAt : null, finishedAt: isDay(b.finishedAt) ? b.finishedAt : null,
      isbn: str(b.isbn).replace(/[^0-9]/g, ''), kdc: /^\d{3}$/.test(str(b.kdc)) ? b.kdc : null,
    }));
  }
  const isDone = b => b.status === 'done';
  const isCandidate = b => !!b.isbn && b.category === '기타';   // ISBN 이 있는데 분야가 기타 = 다시 분류할 후보

  function reading(store, now) {
    const books = cleanBooks(store), logs = obj(store.book_logs), tg = Object.assign({}, DEFAULT_TARGETS);
    Object.keys(obj(store.book_targets)).forEach(c => { const v = num(store.book_targets[c]); if (BOOK_CATS.includes(c) && v != null && v >= 0) tg[c] = v; });
    const fields = BOOK_CATS.map(c => {
      const list = books.filter(b => b.category === c), done = list.filter(isDone).length;
      return { cat: c, count: list.length, completed: done, target: tg[c], pct: pct(done, tg[c]), candidates: list.filter(isCandidate).length };
    });
    const nd = new Date(now), monthly = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(nd.getFullYear(), nd.getMonth() - i, 1), ym = d.getFullYear() + '-' + pad(d.getMonth() + 1);
      monthly.push({ month: ym, completed: books.filter(b => isDone(b) && b.finishedAt && b.finishedAt.slice(0, 7) === ym).length });
    }
    const notesPerBook = books.map(b => ({ id: b.id, title: b.title, notes: bookNotes(logs, b.id).length, hasReview: !!b.review })).filter(x => x.notes || x.hasReview);
    const recent = books.filter(b => isDone(b) && b.finishedAt).sort((a, b) => (a.finishedAt < b.finishedAt ? 1 : -1)).slice(0, 5)
      .map(b => ({ id: b.id, title: b.title, category: b.category, finishedAt: b.finishedAt, rating: b.rating }));
    const done = books.filter(isDone).length;
    return {
      total: books.length, completed: done, reading: books.filter(b => b.status === 'reading').length,
      candidates: books.filter(isCandidate).length, fields, monthly, notesPerBook, recent,
      n: books.length, coverage: null, insufficient: false,
    };
  }

  // 지도에 넘길 데이터 (책 + 메모 + 승인된 연결만)
  function mapData(store, now) {
    const books = cleanBooks(store), logs = obj(store.book_logs), ids = new Set(books.map(b => b.id));
    const links = arr(store.book_links).filter(l => l && l.approved === true && ids.has(l.a) && ids.has(l.b) && l.a !== l.b)
      .map(l => ({ a: l.a, b: l.b, reason: str(l.reason) }));
    const r = reading(store, now), cut = localDayKey(new Date(now - 30 * DAY));
    return {
      fields: r.fields,
      books: books.map(b => Object.assign({}, b, {
        notes: bookNotes(logs, b.id), candidate: isCandidate(b),
        recent: isDone(b) && !!b.finishedAt && b.finishedAt >= cut,
        linked: links.filter(l => l.a === b.id || l.b === b.id).map(l => ({ id: l.a === b.id ? l.b : l.a, reason: l.reason })),
      })),
      links,
    };
  }

  // 제목·저자·감상·메모 검색 (소문자 포함 여부)
  function searchBooks(store, q, limit) {
    const s = str(q).trim().toLowerCase(); if (!s) return [];
    const logs = obj(store.book_logs);
    return cleanBooks(store).map(b => {
      const notes = bookNotes(logs, b.id), hits = [];
      if ((b.title + ' ' + b.author).toLowerCase().includes(s)) hits.push('제목');
      if (b.review.toLowerCase().includes(s)) hits.push('감상');
      const nh = notes.filter(x => x.note.toLowerCase().includes(s));
      if (nh.length) hits.push('메모');
      return hits.length ? { id: b.id, title: b.title, author: b.author, category: b.category, status: b.status, rating: b.rating, finishedAt: b.finishedAt, review: b.review, notes: notes, matched: hits } : null;
    }).filter(Boolean).slice(0, limit || 50);
  }

  // ================= 운동 =================
  // 주 시작: weekStart 'sun' 이면 일요일, 그 외 월요일. 기기 현지 시간 기준 (심박 탭 startOfWeek 와 같은 방식)
  function localWeekStart(now, weekStart) {
    const ws = weekStart === 'sun' ? 0 : 1, d = new Date(now);
    d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() - ws + 7) % 7);
    return d.getTime();
  }
  function cleanSessions(store) {
    return arr(store.hr_sessions).map(s => ({ date: num(s && s.date), duration: num(s && s.duration), z2: num(s && Array.isArray(s.zoneSec) ? s.zoneSec[2] : null) }))
      .filter(s => s.date != null);   // 날짜 없는 기록은 버린다
  }
  function measureWindow(ms, now, days, morningOnly) {
    const from = now - days * DAY;
    const pick = ms.filter(m => m.date > from && m.date <= now && (!morningOnly || new Date(m.date).getHours() < 10));
    const stat = key => {
      const v = pick.filter(m => m[key] != null), dayset = new Set(v.map(m => localDayKey(new Date(m.date))));
      return Object.assign({ mean: r1(mean(v.map(m => m[key]))) }, sample(v.length, dayset.size / days));
    };
    return { rhr: stat('rhr'), hrv: stat('hrv') };
  }
  function compare(ms, now, morningOnly) {
    const w7 = measureWindow(ms, now, 7, morningOnly), w30 = measureWindow(ms, now, 30, morningOnly), out = {};
    ['rhr', 'hrv'].forEach(k => {
      const a = w7[k], b = w30[k];
      out[k] = { mean7: a.mean, n7: a.n, coverage7: a.coverage, mean30: b.mean, n30: b.n, coverage30: b.coverage,
        diff: a.mean != null && b.mean != null ? r1(a.mean - b.mean) : null, insufficient: a.insufficient || b.insufficient };
    });
    return out;
  }
  function exercise(store, now, weekStart) {
    const ss = cleanSessions(store), settings = obj(store.hr_settings);
    const ws = localWeekStart(now, weekStart != null ? weekStart : settings.weekStart);
    const week = ss.filter(s => s.date >= ws);
    const z2sec = week.reduce((a, s) => a + (s.z2 || 0), 0), goal = num(settings.goal) > 0 ? num(settings.goal) : 150;
    const prev4 = ss.filter(s => s.date >= ws - 28 * DAY && s.date < ws).length;
    const last = ss.reduce((m, s) => Math.max(m, s.date), -Infinity);
    const ms = arr(store.hr_measures).map(m => ({ date: num(m && m.date), rhr: num(m && m.rhr) > 0 ? num(m.rhr) : null, hrv: num(m && m.hrv) > 0 ? num(m.hrv) : null })).filter(m => m.date != null);
    return {
      weekStart: ws,
      zone2: { min: Math.round(z2sec / 60), goal, pct: pct(Math.round(z2sec / 60), goal), n: week.length, coverage: null, insufficient: false },
      sessions: { thisWeek: week.length, prev4Weeks: prev4, prev4WeeksAvg: r1(prev4 / 4), n: ss.length, coverage: null, insufficient: false },
      daysSinceLast: isFinite(last) ? Math.floor((now - last) / DAY) : null,
      measures: { all: compare(ms, now, false), morning: compare(ms, now, true), note: 'morning = 현지 시각 10시 전 측정만' },
    };
  }

  // ================= 시간 =================
  // 시간 탭(TL-CORE)과 같은 규칙: 겹치면 수동이 자동을 이기고, 같은 종류끼리는 나중에 시작한 쪽이 이긴다. 진행 중 기록은 now 까지.
  function timeEntries(store, now) {
    const all = [];
    Object.keys(store).filter(k => LOG_KEY.test(k)).forEach(k => arr(store[k]).forEach(e => {
      if (e && typeof e.catId === 'string' && num(e.start) != null && (e.end == null || (num(e.end) != null && num(e.end) > num(e.start))))
        all.push({ id: String(e.id), start: num(e.start), end: e.end == null ? null : num(e.end), catId: e.catId, source: e.source || 'manual' });
    }));
    arr(store.hr_sessions).forEach(s => {   // 심박 운동 = 자동 '운동' 기록 (저장되지 않고 매번 계산되는 것과 같게)
      const end = num(s && s.date), dur = num(s && s.duration);
      if (end != null && dur > 0 && dur < 12 * 3600) all.push({ id: 'auto-hr-' + end, start: end - dur * 1000, end, catId: 'exercise', source: 'auto-hr' });
    });
    const cur = obj(store.time_current);
    if (typeof cur.catId === 'string' && num(cur.start) != null) all.push({ id: '__cur', start: num(cur.start), end: null, catId: cur.catId, source: 'manual' });
    return all;
  }
  function resolve(entries, now) {
    const es = [];
    entries.forEach(e => { const t = e.end == null ? now : e.end; if (t > e.start) es.push({ e, s: e.start, t, pri: e.source === 'manual' ? 1 : 0 }); });
    const bs = [...new Set(es.flatMap(x => [x.s, x.t]))].sort((a, b) => a - b), out = [];
    for (let i = 0; i + 1 < bs.length; i++) {
      const a = bs[i], b = bs[i + 1];
      let best = null;
      for (const x of es) if (x.s <= a && x.t >= b && (!best || x.pri > best.pri || (x.pri === best.pri && x.s > best.s))) best = x;
      if (best) out.push({ start: a, end: b, catId: best.e.catId });
    }
    return out;
  }

// 동기화 파일 { rev, data: { 키: 문자열 } } 과 백업 파일 { app: 'hr-monitor', data: { 키: 값 } } 둘 다 받는다

    { name: 'get_exercise', description: '운동 지표: 이번 주 Zone 2 분과 목표, 운동 횟수, 마지막 운동 후 일수, 안정시 심박·HRV 7일 vs 30일 평균(전체·아침), 각 표본 수와 insufficient.', execute: () => ({ exercise: M.exercise(STORE, Date.now(), WS()), goals: M.goals(STORE, Date.now(), WS()) }) },
    { name: 'get_timeuse', description: '시간 사용 지표: 지정한 날(기본 오늘, YYYY-MM-DD, 한국 시간)의 분류별 분과 앞 28일 평균, 평일·주말 수면, 기록률, 유튜브·수면 목표 상태.', inputSchema: { type: 'object', properties: { day: { type: 'string', description: 'YYYY-MM-DD' } } },
      execute: i => { const d = /^\d{4}-\d{2}-\d{2}$/.test(String(i && i.day || '')) ? String(i.day) : today(); const r = M.timeuse(STORE, d, Date.now()); if (r.error) throw new Error('날짜 형식이 틀렸어요'); const g = M.goals(STORE, Date.now(), WS()); return { timeuse: r, goals: { youtube: g.youtube, sleep: g.sleep } }; } },
    { name: 'search_books', description: '내 책 검색: 제목·저자·감상·메모에 검색어가 들어간 책의 제목·분야·별점·완독일·감상·날짜별 메모. 검색어를 비우면 전체 책의 제목·분야·별점만.', inputSchema: { type: 'object', properties: { query: { type: 'string' } } },
      execute: i => {
        const q = String(i && i.query || '').trim();
        if (!q) return M.mapData(STORE, Date.now()).books.slice(0, 300).map(b => ({ title: b.title, author: b.author, category: b.category, status: b.status, rating: b.rating }));
        return M.searchBooks(STORE, q, 15).map(b => ({ title: b.title, author: b.author, category: b.category, rating: b.rating, finishedAt: b.finishedAt, review: b.review, notes: b.notes.slice(-10).map(n => ({ day: n.day, note: n.note })) }));
      } },
  ];
}
const AI_ERR = { rate_limited: '요청이 많아요. 잠시 뒤 다시 물어보세요.', session_expired: 'claude.ai 에 다시 로그인해 주세요.', refused: '이 질문에는 답하지 못했어요. 질문을 바꿔 보세요.', empty_completion: '답이 비어 있어요. 질문을 바꿔 보세요.', prompt_too_large: '대화가 너무 길어요. 페이지를 새로 열어 주세요.', upstream_error: '연결이 끊겼어요. 다시 물어보세요.' };
function bubble(cls, text) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; $('chat').appendChild(d); return d; }
async function ask(q) {
  q = String(q || '').trim(); if (!q || !sample || !STORE || ctl) return;
  bubble('me', q); $('askIn').value = '';
  turns.push({ role: 'user', content: q });
  const out = bubble('ai', '생각하는 중…');
  ctl = new AbortController(); $('stopBtn').classList.remove('hidden'); $('askBtn').disabled = true;
  try {
    // 최근 8개만, 맨 앞이 AI 답이면 빼고, 규칙·오늘 날짜는 첫 사용자 질문 앞에 붙인다 (규칙만 따로 보내지 않음)
    const hist = turns.slice(-8);
    if (hist.length && hist[0].role === 'assistant') hist.shift();
    hist[0] = { role: 'user', content: RULES + '\n\n오늘(한국 시간): ' + today() + '\n\n' + hist[0].content };
    const { text, truncated } = await sample(hist, { signal: ctl.signal, tools: aiTools(), onText: ({ text }) => { out.textContent = text; } });
    out.textContent = text + (truncated ? '\n(답이 중간에 잘렸어요)' : '');
    turns.push({ role: 'assistant', content: text });
  } catch (e) {
    turns.pop();
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'capability_disabled' || e.code === 'not_declared' || e.code === 'tools_unavailable')) { out.remove(); hideAI(); }
    else if (e && e.code === 'cancelled') out.textContent = (e.text || '') + '\n(멈춤)';
    else { out.className = 'msg err'; out.textContent = (e && e.text ? e.text + '\n' : '') + (AI_ERR[e && e.code] || '답을 받지 못했어요 (' + (e && e.code) + ')'); }
  } finally { ctl = null; $('stopBtn').classList.add('hidden'); $('askBtn').disabled = false; }
}
function hideAI() { $('aiTab').classList.add('hidden'); if (tab === 'ai') $('tabs').querySelector('[data-t=map]').click(); }
$('askBtn').onclick = () => ask($('askIn').value);
$('askIn').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask($('askIn').value); } };
$('stopBtn').onclick = () => ctl && ctl.abort();
$('presets').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.fill) { const t = $('askIn'); t.value = b.dataset.p; t.focus(); const i = t.value.indexOf('○○'); t.setSelectionRange(i, i + 2); return; }
  ask(b.dataset.p);
};

// ---------- 시작 ----------
hideAI();   // sample 이 확인되기 전까지 숨김
(async () => {
  const hasClaude = typeof window.claude === 'object' && window.claude && typeof window.claude.use === 'function';
  if (hasClaude) claude.use('sample').then(s => { if (typeof s === 'function') { sample = s; $('aiTab').classList.remove('hidden'); } }).catch(() => {});
  if (!hasClaude) { showLoadBox('claude.ai 밖에서 열려 Drive 를 쓸 수 없어요.'); return; }
  try { setStore(await loadFromDrive(), 'Google Drive: ' + SYNC_FILE_NAME); }
  catch (e) { showLoadBox((e && e.why) || 'Drive 에서 읽지 못했어요'); }
})();
</script>
